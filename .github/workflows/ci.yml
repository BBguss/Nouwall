name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nouwall-core

  windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $d = "nouwall-$v-windows-x64"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/nouwall.exe, target/release/nouwallctl.exe, README.md, README.id.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE $d
          Compress-Archive $d "$d.zip"
          "ZIP=$d.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: nouwall-windows-x64
          path: ${{ env.ZIP }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
