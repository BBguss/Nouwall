<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Jam Kaca</title>
<style>
  :root { --bg: hsl(230 35% 7%); --glass: hsl(230 30% 20% / .35); --line: hsl(220 40% 80% / .14); --text: hsl(220 30% 96%); --muted: hsl(220 15% 70%); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .card { position: fixed; right: 6vw; bottom: 10vh; padding: 28px 40px; border-radius: 28px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(22px) saturate(140%); box-shadow: 0 30px 80px hsl(230 60% 3% / .5); }
  .time { font-size: clamp(56px, 8vw, 128px); font-weight: 200; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .date { margin-top: 10px; font-size: clamp(14px, 1.3vw, 22px); color: var(--muted); letter-spacing: .02em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card"><div class="time" id="t">--:--</div><div class="date" id="d"></div></div>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let w, h, blobs;
function size() { w = c.width = innerWidth; h = c.height = innerHeight; }
size(); addEventListener('resize', size);
blobs = Array.from({ length: 6 }, (_, i) => ({ hue: 200 + i * 28, s: 0.6 + Math.random() * 0.6, o: Math.random() * 6.28 }));
let running = true;
addEventListener('nouwall:pause', () => running = false);
addEventListener('nouwall:resume', () => { running = true; requestAnimationFrame(draw); });
function draw(ts) {
  if (!running) return;
  const t = ts / 1000;
  x.fillStyle = 'hsl(230 35% 7%)'; x.fillRect(0, 0, w, h);
  x.globalCompositeOperation = 'lighter';
  for (const b of blobs) {
    const px = w * (0.5 + 0.38 * Math.sin(t * 0.07 * b.s + b.o)), py = h * (0.5 + 0.34 * Math.cos(t * 0.05 * b.s + b.o * 1.3));
    const r = Math.max(w, h) * 0.32;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, `hsl(${b.hue} 80% 55% / .22)`); g.addColorStop(1, 'transparent');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }
  x.globalCompositeOperation = 'source-over';
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
const fmtT = new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit' });
const fmtD = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
function tick() { const n = new Date(); t.textContent = fmtT.format(n); d.textContent = fmtD.format(n); }
const t = document.getElementById('t'), d = document.getElementById('d');
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
